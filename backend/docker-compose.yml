services:
  postgres:
    image: postgres:16-alpine
    container_name: trail-blazers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailblazers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailblazers}
      POSTGRES_DB: ${POSTGRES_DB:-trailblazers}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-trailblazers} -d ${POSTGRES_DB:-trailblazers}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
