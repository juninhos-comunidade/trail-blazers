<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <title>InterviewTrail</title>
  <!--
    O símbolo da marca na proporção de ícone: traço mais grosso e margem maior
    que a versão do header (26x26), para continuar legível a 16px na aba.
    Fundo transparente de propósito — o teal e o âmbar têm contraste suficiente
    tanto em abas claras quanto escuras.
  -->
  <path
    d="M32 88 L52 62 L66 72 L86 40"
    stroke="#34C994"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="32" cy="88" r="7" fill="#34C994" />
  <circle cx="52" cy="62" r="7" fill="#34C994" />
  <circle cx="66" cy="72" r="7" fill="#F5A623" />
  <path d="M86 40 L86 26 L100 31 L86 36" fill="#F5A623" />
  <circle cx="86" cy="40" r="5" fill="#F5A623" />
</svg>
