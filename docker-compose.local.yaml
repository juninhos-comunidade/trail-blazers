services:
  postgres:
    image: postgres:16-alpine
    container_name: trail-blazers-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailblazers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trailblazers}
      POSTGRES_DB: ${POSTGRES_DB:-trailblazers}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trailblazers} -d ${POSTGRES_DB:-trailblazers}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:24-alpine
    container_name: trail-blazers-local-backend
    restart: unless-stopped
    working_dir: /workspace/backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./:/workspace
      - backend_node_modules:/workspace/backend/node_modules
    command: >
      sh -c "npm install &&
             npm run prisma:generate &&
             npm run start:dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-trailblazers}:${POSTGRES_PASSWORD:-trailblazers}@postgres:5432/${POSTGRES_DB:-trailblazers}?schema=public
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FRONTEND_URL: http://192.168.0.169:3001
      GITHUB_CALLBACK_URL: http://192.168.0.169:3000/auth/github/callback
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-com-no-minimo-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    container_name: trail-blazers-local-frontend
    restart: unless-stopped
    working_dir: /workspace/frontend
    volumes:
      - ./:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0 --port 3001 --strictPort"
    environment:
      VITE_API_URL: http://192.168.0.169:3000
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
